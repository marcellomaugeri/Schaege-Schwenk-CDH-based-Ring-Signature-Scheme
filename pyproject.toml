[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ssringsignaturescheme"
version = "0.1.0"
description = "The Schäge-Schwenk CDH-based ring signature scheme using Charm-Crypto"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Marcello Maugeri", email = "marcellomaugeriphd@gmail.com"}]
dependencies = ["charm-crypto-framework==0.62"]

[project.optional-dependencies]
demo = ["typer>=0.12,<1"]
test = ["pytest>=8", "typer>=0.12,<1"]

[project.urls]
Repository = "https://github.com/marcellomaugeri/Schaege-Schwenk-CDH-based-Ring-Signature-Scheme"

[tool.flit.sdist]
include = ["demo.py", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
